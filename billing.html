<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>சிட்டை பில்</title>
<meta name="theme-color" content="#0b5d4b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="சிட்டை பில்">
<link rel="manifest" href="manifest-billing.webmanifest">
<link rel="icon" href="icon-shop-192.png">
<link rel="apple-touch-icon" href="icon-shop-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f3f5f4;--card:#fff;--soft:#f5f7f6;--bd:#e3e8e6;--tx:#101a17;--mu:#6b7873;--mu2:#45524d;
  --g:#0f8a6c;--g2:#0b5d4b;--gs:#e7f5f0;--or:#c2410c;--ors:#fff1e6;--bl:#1d4ed8;--bls:#e8efff;--rd:#dc2626;--rds:#fdecec;--yl:#a16207;--yls:#fef6dc;
  --sh:0 1px 3px rgba(16,26,23,.08);--nav:64px}
html,body{background:var(--bg)}
body{font-family:'Noto Sans Tamil',system-ui,sans-serif;color:var(--tx);max-width:560px;margin:0 auto;min-height:100vh;font-size:14px;line-height:1.45;padding-bottom:calc(var(--nav) + 70px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select{font-family:inherit}
.hide{display:none!important}
.num{font-variant-numeric:tabular-nums}
/* header */
.hd{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
.hd .av{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.hd .tt{flex:1;min-width:0}
.hd .tt b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .tt small{font-size:11.5px;opacity:.9;font-weight:600}
.sync{border:0;border-radius:20px;padding:6px 10px;font-size:11.5px;font-weight:800;background:rgba(255,255,255,.16);color:#fff;white-space:nowrap}
.sync.w{background:#fef3c7;color:#92400e}.sync.off{background:#fee2e2;color:#991b1b}
.hd a.bk{color:#fff;text-decoration:none;font-size:20px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(255,255,255,.12)}
.wrap{padding:12px}
/* tabs */
.tb{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:560px;margin:0 auto;background:var(--card);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));height:calc(var(--nav) + env(safe-area-inset-bottom))}
.tb button{border:0;background:none;border-radius:12px;font-size:12px;font-weight:800;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tb button span{font-size:21px;line-height:1}
.tb button.on{color:var(--g2);background:var(--gs)}
/* search */
.sr{display:flex;gap:8px;margin-bottom:10px}
.sr .in{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:0 12px;min-height:50px}
.sr .in:focus-within{border-color:var(--g)}
.sr input{flex:1;border:0;outline:none;font-size:16px;background:none;min-width:0;color:var(--tx)}
.sr .x{border:0;background:var(--soft);border-radius:50%;width:28px;height:28px;font-size:12px;color:var(--mu)}
.sr .sc{border:0;border-radius:14px;width:54px;background:var(--g);color:#fff;font-size:22px;flex-shrink:0}
.sec{font-size:12.5px;font-weight:800;color:var(--mu);margin:14px 2px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec:first-child{margin-top:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qk{border:1.5px solid var(--bd);background:var(--card);border-radius:14px;padding:10px 6px;text-align:center;min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.qk .e{font-size:24px;line-height:1}
.qk img{width:34px;height:34px;object-fit:cover;border-radius:8px}
.qk b{font-size:12.5px;font-weight:800;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qk.out{opacity:.45}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--bd);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}
.row .im{width:42px;height:42px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;overflow:hidden}
.row .im img{width:100%;height:100%;object-fit:cover}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{display:block;font-size:12px;color:var(--mu);font-weight:600}
.row .rt{text-align:right;font-weight:800;font-size:13.5px;white-space:nowrap}
.st-g{color:var(--g)}.st-o{color:var(--or)}.st-r{color:var(--rd)}.st-z{color:var(--mu)}
.btn{border:0;border-radius:14px;padding:13px 16px;font-size:15px;font-weight:800;background:var(--g);color:#fff;min-height:50px}
.btn.sm{padding:8px 12px;font-size:13px;min-height:38px;border-radius:11px}
.btn.gh{background:var(--soft);color:var(--tx);border:1px solid var(--bd)}
.btn.rd{background:var(--rds);color:var(--rd)}
.btn.or{background:var(--or)}
.btn.bl{background:var(--bl)}
.btn:disabled{opacity:.5}
.blk{display:block;width:100%}
.add-free{width:100%;border:1.5px dashed var(--bd);background:none;border-radius:14px;padding:12px;font-weight:800;color:var(--mu2);margin-top:8px}
/* cart bar */
.cb{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));z-index:29;max-width:560px;margin:0 auto;padding:8px 10px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.cb button{width:100%;border:0;border-radius:16px;background:var(--g2);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px;min-height:58px;box-shadow:0 6px 18px rgba(11,93,75,.3)}
.cb .c{background:rgba(255,255,255,.18);border-radius:10px;padding:3px 9px;font-weight:800;font-size:13px}
.cb .t{flex:1;text-align:left;font-size:19px;font-weight:800}
.cb .g{font-weight:800;font-size:15px}
/* sheet */
.sh{position:fixed;inset:0;z-index:50;display:none}
.sh.on{display:block}
.sh-bg{position:absolute;inset:0;background:rgba(16,26,23,.45)}
.sh-p{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92vh;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column}
.sh-p.an{animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--bd)}
.sh-h b{flex:1;font-size:16.5px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-h button{border:0;background:#e5e7eb;border-radius:50%;width:34px;height:34px;font-size:15px;flex-shrink:0}
.sh-b{overflow-y:auto;padding:12px 12px 14px}
.sh-f{padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);background:var(--card);display:flex;gap:8px}
.sh-f .btn{flex:1}
/* pack lines */
.pk{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1.5px solid var(--bd);border-radius:14px;margin-bottom:8px}
.pk.on{border-color:var(--g);background:var(--gs)}
.pk .w{flex:1;min-width:0}
.pk .w b{display:block;font-size:15px;font-weight:800}
.pk .w small{color:var(--mu);font-weight:700;font-size:12px}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);font-size:20px;font-weight:800}
.stp button.p{background:var(--g);border-color:var(--g);color:#fff}
.stp span{min-width:26px;text-align:center;font-weight:800;font-size:16px}
.lbl{display:block;font-size:12px;font-weight:800;color:var(--mu);margin:10px 2px 6px}
.inp{width:100%;border:1.5px solid var(--bd);border-radius:12px;padding:12px;font-size:16px;background:var(--card);outline:none;color:var(--tx)}
.inp:focus{border-color:var(--g)}
.ig{display:flex;gap:8px;align-items:center}
.ig .inp{flex:1}
.ig .u{font-weight:800;color:var(--mu2);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--bd);background:var(--card);border-radius:20px;padding:7px 12px;font-size:13px;font-weight:800;color:var(--mu2)}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.chip.r.on{background:var(--rd);border-color:var(--rd)}.chip.o.on{background:var(--or);border-color:var(--or)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1.5px solid var(--bd);background:var(--card);border-radius:12px;padding:10px 4px;font-weight:800;font-size:13px}
.seg button.on{border-color:var(--g);background:var(--gs);color:var(--g2)}
.seg button small{display:block;font-size:11px;color:var(--mu);font-weight:700}
.prev{margin-top:10px;font-weight:800;font-size:15px;text-align:right}
/* cart lines */
.cl{display:flex;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid var(--bd)}
.cl .tx{flex:1;min-width:0}
.cl .tx b{display:block;font-size:14px;font-weight:800}
.cl .tx small{color:var(--mu);font-weight:700;font-size:12px}
.cl .am{font-weight:800;min-width:64px;text-align:right}
.cl .rm{border:0;background:var(--rds);color:var(--rd);border-radius:10px;width:34px;height:34px;font-size:14px}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:12px 2px 4px;font-size:15px;font-weight:800}
.tot b{font-size:26px}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.pay button{border:2px solid var(--bd);background:var(--card);border-radius:14px;padding:12px 4px;font-weight:800;font-size:14px}
.pay button span{display:block;font-size:22px}
.pay button.on{border-color:var(--g);background:var(--gs);color:var(--g2)}
.pay button.cr.on{border-color:var(--or);background:var(--ors);color:var(--or)}
/* receipt */
.rc{background:#fff;border:1px dashed #cbd5e1;border-radius:14px;padding:14px;font-size:13.5px}
.rc h3{text-align:center;font-size:16px;font-weight:800}
.rc .m{text-align:center;color:var(--mu);font-size:12px;font-weight:700;margin-bottom:8px}
.rc .l{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.rc .l span:first-child{flex:1;min-width:0}
.rc hr{border:0;border-top:1px dashed #cbd5e1;margin:8px 0}
.rc .T{font-size:17px;font-weight:800}
.okb{text-align:center;padding:4px 0 10px}
.okb b{display:block;font-size:44px;line-height:1.1}
.okb span{font-weight:800;font-size:16px}
/* report */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px}
.tile small{display:block;font-size:12px;font-weight:800;color:var(--mu)}
.tile b{display:block;font-size:22px;font-weight:800;margin-top:2px}
.tile i{font-style:normal;font-size:11.5px;color:var(--mu);font-weight:700}
.tile.big{grid-column:1/-1;background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;border:0}
.tile.big small,.tile.big i{color:rgba(255,255,255,.85)}
.empty{text-align:center;padding:30px 12px;color:var(--mu);font-weight:700}
.empty b{display:block;font-size:40px;margin-bottom:6px}
.note{font-size:12.5px;color:var(--mu);font-weight:600;line-height:1.55;margin:0 2px 10px}
/* scanner */
.scan{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3}
.scan video{width:100%;height:100%;object-fit:cover}
.scan .ln{position:absolute;left:10%;right:10%;top:50%;height:2px;background:#22c55e;box-shadow:0 0 12px #22c55e;animation:sl 1.6s ease-in-out infinite alternate}
@keyframes sl{from{top:30%}to{top:70%}}
/* auth */
.lg{max-width:400px;margin:10vh auto 0;padding:0 16px}
.lg h2{font-size:21px;font-weight:800;margin-bottom:4px}
.lg p{font-size:13px;color:var(--mu);margin-bottom:14px;line-height:1.55}
.lg .inp{margin-bottom:10px}
.er{color:var(--rd);font-weight:700;font-size:13px;min-height:20px;margin-top:8px}
.ver{text-align:center;font-size:11px;color:#9ca3af;margin:16px 0 4px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#101a17;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="sh" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>
// ═══ 🧾 சிட்டை பில் — கடைக்கான கவுண்டர் பில் · சரக்கு · கணக்கு (எல்லாக் கடைக்கும் பொருந்தும்: கிலோ / லிட்டர் / எண்ணிக்கை)
//     கடை app (shop.html)-ன் அதே login. Net இல்லாமலும் பில் போடலாம் — net வந்ததும் தானாக அனுப்பப்படும்.
//     Server: inventory.sql (inv · counter_sales · counter_sale() · inv_set() · inv_add() · barcode_set())
const VER='பதிப்பு 11-10-2026';
const SB_URL='https://cerstnckjygvcfekfxcp.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlcnN0bmNranlndmNmZWtmeGNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzOTY2NDEsImV4cCI6MjA5Mzk3MjY0MX0.Yl-5QyyEyiwmXG9u1kL08CxIanU-22Fx-HicEe2VYi8';
const AKEY='sitta_shop_auth'; // shop.html (supabase-js) சேமிக்கும் அதே இடம் — ஒருமுறை login போதும்
const UNIT={kg:{s:'கி.கி',n:'கிலோ',sub:'அரிசி, பருப்பு, காய்கறி'},l:{s:'லி',n:'லிட்டர்',sub:'எண்ணெய், பால்'},pc:{s:'பீஸ்',n:'எண்ணிக்கை',sub:'பாக்கெட், சோப்பு, முட்டை'}};
const PAY={cash:['💵','பணம்'],upi:['📲','UPI'],credit:['📒','கடன்']};

const $=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const r3=n=>Math.round((+n||0)*1000)/1000;
const rs=n=>'₹'+r2(n).toLocaleString('en-IN',{maximumFractionDigits:2});
function lsGet(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2400);}
function uuid(){try{return crypto.randomUUID();}catch(e){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);});}}
function hm(t){const d=new Date(t);return isNaN(d)?'':d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true}).replace(/\s?(am|pm)/i,(m,a)=>a.toLowerCase());}
function dayStart(off){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(off||0));return d;}
function ph10(v){let d=String(v||'').replace(/\D/g,'');if(d.length===12&&d.startsWith('91'))d=d.slice(2);return /^[6-9]\d{9}$/.test(d)?d:'';}

// ── அளவு: பாக்கெட் ஒன்றில் எவ்வளவு (inventory.sql pack_factor-ன் அதே விதி) ──
function packFactor(w,unit,packq){
  const v=packq&&+packq[w];if(v>0)return v;
  const s=String(w||'').toLowerCase();const m=s.match(/(\d+(?:\.\d+)?)/);let n=m?parseFloat(m[1]):1;if(!(n>0))n=1;
  if(unit==='kg'){if(/(கி\.?\s?கி|கிலோ|kg|kilo)/.test(s))return n;if(/(கிராம்|கி|gm|gram|\d\s?g(\W|$))/.test(s))return n/1000;return 1;}
  if(unit==='l'){if(/(மி\.?\s?லி|ml)/.test(s))return n/1000;if(/(லிட்டர்|லி|ltr|lit|\d\s?l(\W|$))/.test(s))return n;return 1;}
  if(/(பீஸ்|pcs|pc|nos|piece|எண்ணம்)/.test(s))return n;return 1;
}
function guessUnit(p){const t=(p.packs||[]).map(k=>String(k.w||'').toLowerCase()).join(' ');
  if(/(கி\.?\s?கி|கிலோ|kg|கிராம்|\dg\b|\d g\b|gm)/.test(t)||/கி(\s|$)/.test(t))return 'kg';
  if(/(லி|ml|ltr|லிட்டர்)/.test(t))return 'l';return 'pc';}
function fq(q,unit){q=r3(q);if(unit==='kg'&&q>0&&q<1)return r3(q*1000)+' கி';if(unit==='l'&&q>0&&q<1)return r3(q*1000)+' மி.லி';return q+' '+(UNIT[unit]||UNIT.pc).s;}

// ── login (shop.html-ன் supabase-js session-ஐயே படிக்கிறது / எழுதுகிறது) ──
const S={sess:null,me:null,shop:null,prods:[],inv:{},bc:{},cart:[],pay:'cash',cname:'',cphone:'',tab:'bill',q:'',sf:'all',sq:'',day:0,sales:[],orders:[],loaded:false,net:navigator.onLine,flushing:false,loginErr:'',checking:true};
function readSess(){const s=lsGet(AKEY,null);if(s&&s.access_token&&s.user&&s.user.id)return s;return null;}
function saveSess(d){S.sess={access_token:d.access_token,refresh_token:d.refresh_token,token_type:'bearer',expires_in:d.expires_in||3600,expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600),user:d.user};lsSet(AKEY,S.sess);}
function hdr(x){return Object.assign({'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+(S.sess?S.sess.access_token:SB_KEY)},x||{});}
let _rp=null;
function refresh(){if(_rp)return _rp;_rp=(async()=>{
  const st=readSess();if(st&&st.access_token!==(S.sess&&S.sess.access_token)&&(st.expires_at*1000-Date.now()>60000)){S.sess=st;return true;} // shop.html ஏற்கனவே புதுப்பித்திருக்கலாம்
  if(!S.sess||!S.sess.refresh_token)return false;const used=S.sess.refresh_token;
  try{const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY},body:JSON.stringify({refresh_token:used})});
    const d=await r.json().catch(()=>({}));

    saveSess(d);return true;}catch(e){return false;}})().finally(()=>{_rp=null;});return _rp;}
async function fresh(){if(!S.sess)return false;if(S.sess.expires_at*1000-Date.now()<60000)return await refresh();return true;}
async function api(path,opt){if(!await fresh())throw new Error('auth');const r=await fetch(`${SB_URL}/rest/v1/${path}`,Object.assign({headers:hdr()},opt||{}));

const CKEY=()=>'sitta_bill_cache_'+(S.shop?S.shop.id:'');

    if(!p||!p.approved||p.role!=='merchant'||!p.shop_id){S.checking=false;S.me=null;S.loginErr=p&&p.role==='admin'?'இது அட்மின் கணக்கு — கடைக்காரர் கணக்கில் உள்நுழையுங்கள்':'இந்தக் கணக்குக்கு கடை அனுமதி இல்லை';S.sess=null;render();return;}
    S.me=p;const s=(await api(`shops?id=eq.${encodeURIComponent(p.shop_id)}&select=id,name,logo`))[0]||{id:p.shop_id,name:'கடை'};

  }catch(e){

    if(cachedMe&&cachedMe.uid===S.sess.user.id){S.me=cachedMe.me;S.shop=cachedMe.shop;S.net=false;} // net இல்லை: கடைசியாகச் சேமித்ததை வைத்து
    else{S.checking=false;S.loginErr='📴 Network பிரச்சனை — net வந்ததும் மீண்டும் திறக்கவும்';render();return;}
  }
  S.checking=false;
  const c=lsGet(CKEY(),null);if(c){S.prods=c.prods||[];S.inv=c.inv||{};S.bc=c.bc||{};S.loaded=true;}

}
async function loadData(){
  if(!S.shop)return;
  try{
    const sid=encodeURIComponent(S.shop.id);
    const [pr,iv,bc]=await Promise.all([
      api(`products?select=id,name,brand,emoji,photo,hidden,stock,packs&shop_id=eq.${sid}&order=name`),
      api(`inv?select=product_id,unit,qty,low_at,packq,products!inner(shop_id)&products.shop_id=eq.${sid}`).catch(e=>{if(/inv|relation|schema/i.test(e.message))S.noSql=true;return [];}),
      api(`barcodes?select=code,product_id,pack&shop_id=eq.${sid}`).catch(()=>[])]);
    S.prods=pr||[];S.inv={};(iv||[]).forEach(x=>{S.inv[x.product_id]={unit:x.unit,qty:+x.qty,low_at:+x.low_at,packq:x.packq||{}};});
    // அனுப்பக் காத்திருக்கும் பில்கள் இன்னும் server-ல் கழிக்கப்படவில்லை → இங்கே மட்டும் கழித்துக் காட்டு

    S.loaded=true;S.net=true;lsSet(CKEY(),{prods:S.prods,inv:S.inv,bc:S.bc,at:Date.now()});

function applyLocal(items,sign){(items||[]).forEach(it=>{const v=it.pid&&S.inv[it.pid];if(!v)return;const f=it.pk?packFactor(it.pk,v.unit,v.packq):1;v.qty=Math.max(0,r3(v.qty+sign*it.q*f));});}
function stockOf(p){const v=S.inv[p.id];if(!v)return null;return v;}
function stCls(v){return !v?'st-z':v.qty<=0?'st-r':v.qty<=v.low_at?'st-o':'st-g';}

// ── அனுப்பக் காத்திருக்கும் பில்கள் (net இல்லாத போது) ──
const QKEY='sitta_bill_q';
function queue(){return lsGet(QKEY,[]).filter(b=>!S.shop||b.shop===S.shop.id);}
function qAll(){return lsGet(QKEY,[]);}
async function flush(){
  if(S.flushing||!S.sess||!S.shop)return;const q=queue();if(!q.length){renderSync();return;}
  S.flushing=true;renderSync();
  try{
    for(const b of q){
      let d;try{d=await rpc('counter_sale',{p_id:b.id,p_shop:b.shop,p_items:b.items,p_pay:b.pay,p_name:b.name||null,p_phone:b.phone||null,p_at:b.at});}
      catch(e){if(/counter_sale|function/i.test(e.message)&&!/fetch|network/i.test(e.message)){S.noSql=true;}S.net=false;break;}
      const all=qAll();const i=all.findIndex(x=>x.id===b.id);
      if(d&&d.ok){if(i>=0)all.splice(i,1);lsSet(QKEY,all);const last=lsGet('sitta_bill_last',null);if(last&&last.id===b.id){last.no=d.bill_no;lsSet('sitta_bill_last',last);}S.net=true;}
      else{if(i>=0){all[i].err=(d&&d.msg)||'பிழை';lsSet(QKEY,all);}toast('⚠️ பில் சேமிக்க முடியவில்லை: '+((d&&d.msg)||''));break;}
    }
  }finally{S.flushing=false;renderSync();if(S.tab==='rep')loadReport();}
}

// ── பொருள் சேர் (பாக்கெட் / தளர்வாக) ──
function loosePrice(p,v){
  const saved=lsGet('sitta_bill_lp',{})[p.id];if(saved>0)return saved;
  const u=v?v.unit:guessUnit(p);let best=null,bd=1e9;
  (p.packs||[]).forEach(k=>{const pr=+k.price;if(!(pr>0))return;const f=packFactor(k.w,u,v&&v.packq);if(!(f>0))return;const d=Math.abs(Math.log(f));if(d<bd){bd=d;best=pr/f;}});
  return best?r2(best):'';
}
window.openAdd=function(pid){
  const p=S.prods.find(x=>x.id===pid);if(!p)return;const v=stockOf(p);const u=v?v.unit:guessUnit(p);

  const p=S.prods.find(x=>x.id===SH.pid);const v=stockOf(p);const u=v?v.unit:guessUnit(p);
  const packs=(p.packs||[]).filter(k=>k&&k.w);
  let b=v?`<div class="note ${stCls(v)}" style="font-weight:800">📦 கையிருப்பு: ${fq(v.qty,v.unit)}${v.qty<=0?' — தீர்ந்தது (இருந்தாலும் பில் போடலாம்)':''}</div>`:'';
  if(packs.length)b+=`<div class="lbl">பாக்கெட் / அளவு</div>`+packs.map((k,i)=>{const n=SH.cnt[i]||0;return `<div class="pk${n?' on':''}"><div class="w"><b>${esc(k.w)}</b><small>${k.price!=null&&k.price!==''?rs(k.price):'விலை இல்லை'}</small></div><div class="stp"><button onclick="addCnt(${i},-1)" ${n?'':'style="visibility:hidden"'}>−</button><span>${n||''}</span><button class="p" onclick="addCnt(${i},1)">+</button></div></div>`;}).join('');
  const lu=SH.lu,unitTxt=u==='kg'?(lu==='g'?'கிராம்':'கிலோ'):u==='l'?(lu==='ml'?'மி.லி':'லிட்டர்'):'எண்ணிக்கை';

window.openSetup=function(pid){
  const p=S.prods.find(x=>x.id===pid);if(!p)return;const v=S.inv[pid];
  SH={k:'setup',pid,unit:v?v.unit:guessUnit(p),qty:v?String(v.qty):'',low:v?String(v.low_at):'',pq:Object.assign({},v?v.packq:{})};
  renderSetup();
};
function renderSetup(){
  const p=S.prods.find(x=>x.id===SH.pid);const v=S.inv[SH.pid];const u=SH.unit;const packs=(p.packs||[]).filter(k=>k&&k.w);
  const bcs=Object.keys(S.bc).filter(c=>S.bc[c].pid===p.id);
  const b=`<div class="lbl">எப்படி அளப்பீர்கள்?</div><div class="seg">${Object.keys(UNIT).map(k=>`<button class="${u===k?'on':''}" onclick="SH.unit='${k}';renderSetup()">${UNIT[k].n}<small>${UNIT[k].s}</small></button>`).join('')}</div>
    <div class="note" style="margin-top:6px">${UNIT[u].sub}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label class="lbl">இப்போது கையிருப்பு</label><div class="ig"><input class="inp num" id="su-q" type="number" inputmode="decimal" min="0" placeholder="0" value="${esc(SH.qty)}" oninput="SH.qty=this.value"><span class="u">${UNIT[u].s}</span></div></div>
      <div><label class="lbl">குறைவு எல்லை 🔔</label><div class="ig"><input class="inp num" id="su-l" type="number" inputmode="decimal" min="0" placeholder="0" value="${esc(SH.low)}" oninput="SH.low=this.value"><span class="u">${UNIT[u].s}</span></div></div></div>
    ${packs.length?`<div class="lbl">ஒரு பாக்கெட்டில் எவ்வளவு? <small style="font-weight:600">(விற்கும்போது இவ்வளவு குறையும்)</small></div><div class="card" style="margin:0;padding:6px 12px">${packs.map((k,i)=>{const auto=packFactor(k.w,u,{});const cur=SH.pq[k.w]!=null?SH.pq[k.w]:'';
      return `<div class="ig" style="padding:6px 0;border-bottom:1px solid var(--bd)"><b style="flex:1;font-size:14px">${esc(k.w)}</b><input class="inp num" style="flex:0 0 96px;padding:9px" type="number" inputmode="decimal" min="0" placeholder="${auto}" value="${esc(cur)}" oninput="spq(${i},this.value)"><span class="u" style="width:38px">${UNIT[u].s}</span></div>`;}).join('')}<div class="note" style="margin:6px 0 2px">காலியாக விட்டால் பெயரிலிருந்து தானாக (சாம்பல் எண்)</div></div>`:''}
    ${('BarcodeDetector' in window)?`<div class="lbl">Barcode</div><div class="card" style="margin:0">${bcs.length?bcs.map(c=>`<div style="font-size:13px;font-weight:700">🔗 ${esc(c)} ${S.bc[c].pk?'· '+esc(S.bc[c].pk):''}</div>`).join(''):'<div class="note" style="margin:0">இணைக்கவில்லை</div>'}<div class="note" style="margin:6px 0 0">பில் திரையில் 📷 தட்டி scan செய்தால் இணைக்கலாம்</div></div>`:''}
    ${v?`<button class="btn rd blk" style="margin-top:14px" onclick="stopTrack()">கணக்கு வைப்பதை நிறுத்து</button>`:''}`;
  sheet('📦 '+esc(p.name),b,`<button class="btn gh" onclick="closeSheet()">ரத்து</button><button class="btn" style="flex:2" onclick="saveSetup()">சேமி ✓</button>`);
}
window.spq=function(i,val){const p=S.prods.find(x=>x.id===SH.pid);const k=(p.packs||[]).filter(k=>k&&k.w)[i];if(!k)return;if(val===''||!(+val>0))delete SH.pq[k.w];else SH.pq[k.w]=+val;};
window.saveSetup=async function(){
  const q=SH.qty===''?NaN:+SH.qty,l=SH.low===''?0:+SH.low;
  if(!(q>=0)){toast('இப்போதைய கையிருப்பு போடுங்கள் (0 என்றாலும்)');return;}if(!(l>=0)){toast('குறைவு எல்லை சரியில்லை');return;}
  try{const d=await rpc('inv_set',{p_product:SH.pid,p_unit:SH.unit,p_qty:r3(q),p_low:r3(l),p_packq:SH.pq});if(!d||!d.ok)throw new Error(d&&d.msg);
    S.inv[SH.pid]={unit:SH.unit,qty:r3(q),low_at:r3(l),packq:SH.pq};const p=S.prods.find(x=>x.id===SH.pid);if(p&&q>0&&p.stock==='out')p.stock='ok';
    lsSet(CKEY(),{prods:S.prods,inv:S.inv,bc:S.bc,at:Date.now()});closeSheet();render();toast('✅ சேமிக்கப்பட்டது');
  }catch(e){toast('⚠️ சேமிக்க net தேவை'+(e&&e.message&&!/fetch/i.test(e.message)?' — '+e.message:''));}
};
window.stopTrack=async function(){if(!confirm('இந்தப் பொருளுக்குக் கையிருப்புக் கணக்கை நிறுத்தவா?'))return;
  try{const d=await rpc('inv_set',{p_product:SH.pid,p_unit:null,p_qty:0});if(!d||!d.ok)throw new Error(d&&d.msg);delete S.inv[SH.pid];closeSheet();render();toast('கணக்கு நிறுத்தப்பட்டது');}
  catch(e){toast('⚠️ net தேவை');}};
window.openIn=function(pid){const p=S.prods.find(x=>x.id===pid);const v=S.inv[pid];if(!p||!v)return;SH={k:'in',pid,sign:1,val:''};renderIn();};
function renderIn(){const p=S.prods.find(x=>x.id===SH.pid);const v=S.inv[SH.pid];const u=UNIT[v.unit].s;const quick=v.unit==='pc'?[1,5,10,12,24,50]:[1,5,10,25,50,100];
  sheet((SH.sign>0?'＋ சரக்கு வரவு — ':'− குறைப்பு — ')+esc(p.name),`<div class="note">இப்போது: <b>${fq(v.qty,v.unit)}</b></div>
    <div class="seg" style="grid-template-columns:1fr 1fr"><button class="${SH.sign>0?'on':''}" onclick="SH.sign=1;renderIn()">＋ சரக்கு வந்தது</button><button class="${SH.sign<0?'on':''}" onclick="SH.sign=-1;renderIn()">− சேதம் / குறைப்பு</button></div>
    <label class="lbl">எவ்வளவு?</label><div class="ig"><input class="inp num" id="inv-v" type="number" inputmode="decimal" min="0" placeholder="0" value="${esc(SH.val)}" oninput="SH.val=this.value"><span class="u">${u}</span></div>
    <div class="chips" style="margin-top:8px">${quick.map(n=>`<button class="chip" onclick="SH.val=String((+SH.val||0)+${n});renderIn()">+${n}</button>`).join('')}</div>`,
    `<button class="btn gh" onclick="closeSheet()">ரத்து</button><button class="btn${SH.sign<0?' or':''}" style="flex:2" onclick="saveIn()">${SH.sign>0?'வரவு சேர் ✓':'குறை ✓'}</button>`);
  setTimeout(()=>{const e=$('inv-v');if(e&&!SH.val)e.focus();},200);}
window.saveIn=async function(){const n=+SH.val;if(!(n>0)){toast('எவ்வளவு என்று போடுங்கள்');return;}
  try{const d=await rpc('inv_add',{p_product:SH.pid,p_delta:SH.sign*r3(n),p_note:null});if(!d||!d.ok)throw new Error(d&&d.msg);
    S.inv[SH.pid].qty=+d.qty;const p=S.prods.find(x=>x.id===SH.pid);if(p&&+d.qty>0&&p.stock==='out')p.stock='ok';lsSet(CKEY(),{prods:S.prods,inv:S.inv,bc:S.bc,at:Date.now()});
    closeSheet();render();toast('✅ இப்போது '+fq(+d.qty,S.inv[SH.pid]?S.inv[SH.pid].unit:'pc'));}
  catch(e){toast('⚠️ சேமிக்க net தேவை'+(e&&e.message&&!/fetch/i.test(e.message)?' — '+e.message:''));}};

// ── 📊 கணக்கு ──
function viewReport(){
  const pend=queue();const sa=S.sales.filter(x=>!x.voided);
  const by=k=>sa.filter(x=>x.pay_mode===k).reduce((a,x)=>a+(+x.total||0),0);
  const ct=sa.reduce((a,x)=>a+(+x.total||0),0);
  const dl=S.orders.filter(o=>o.order_status==='DELIVERED'),ot=dl.reduce((a,o)=>a+(+o.total||0),0);
  const low=S.prods.filter(p=>{const v=S.inv[p.id];return v&&v.qty<=v.low_at;});
  let h=`<div class="chips" style="margin-bottom:10px">${[[0,'இன்று'],[1,'நேற்று'],[2,'முந்தைய நாள்']].map(([d,t])=>`<button class="chip${S.day===d?' on':''}" onclick="S.day=${d};S.sales=[];S.orders=[];render();loadReport()">${t}</button>`).join('')}</div>`;
  if(S.repErr)h+=`<div class="card" style="color:var(--rd);font-weight:700">${esc(S.repErr)}</div>`;
  if(pend.length)h+=`<div class="card" style="background:var(--yls);border-color:#fcd34d"><b style="color:var(--yl)">⏳ ${pend.length} பில் இன்னும் அனுப்பப்படவில்லை (${rs(pend.reduce((a,b)=>a+b.total,0))})</b><div class="note" style="margin:4px 0 0">net வந்ததும் தானாக அனுப்பப்படும். ${pend.some(b=>b.err)?'⚠️ '+esc(pend.find(b=>b.err).err):''}</div></div>`;
  h+=`<div class="tiles"><div class="tile big"><small>மொத்த விற்பனை</small><b class="num">${rs(ct+ot)}</b><i>கவுண்டர் ${rs(ct)} + சிட்டை ${rs(ot)}</i></div>
    <div class="tile"><small>🧾 கவுண்டர் பில்</small><b class="num">${rs(ct)}</b><i>${sa.length} பில்</i></div>
    <div class="tile"><small>🛵 சிட்டை ஆர்டர்</small><b class="num">${rs(ot)}</b><i>${dl.length} கொடுத்தது</i></div>
    <div class="tile"><small>💵 பணம் · 📲 UPI</small><b class="num" style="font-size:16px">${rs(by('cash'))} · ${rs(by('upi'))}</b></div>
    <div class="tile"><small>📒 கடன்</small><b class="num" style="color:var(--or)">${rs(by('credit'))}</b></div></div>`;
  if(low.length){const txt='🛒 வாங்க வேண்டிய சரக்கு — '+S.shop.name+'\n'+low.map(p=>'• '+p.name+' (இருப்பு '+fq(S.inv[p.id].qty,S.inv[p.id].unit)+')').join('\n');
    h+=`<div class="sec">⚠️ குறைவான / தீர்ந்த சரக்கு (${low.length})<a class="btn sm" style="background:#25d366;text-decoration:none" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">💬 பட்டியல் அனுப்பு</a></div><div class="card" style="padding:4px 10px">${low.slice(0,40).map(p=>{const v=S.inv[p.id];return `<div class="row"><div class="tx"><b>${esc(p.name)}</b></div><div class="rt ${stCls(v)}">${fq(v.qty,v.unit)}</div><button class="btn sm" onclick="openIn(${p.id})">＋ வரவு</button></div>`;}).join('')}</div>`;}
  h+=`<div class="sec">🧾 பில்கள் (${S.sales.length})</div>`;
  h+=S.sales.length?`<div class="card" style="padding:4px 10px">${S.sales.map(x=>`<button class="row" onclick="openSale('${x.id}')"${x.voided?' style="opacity:.45"':''}><div class="tx"><b>#${x.bill_no||''} · ${rs(x.total)}${x.voided?' · ரத்து':''}</b><small>${hm(x.sold_at)} · ${PAY[x.pay_mode][0]} ${PAY[x.pay_mode][1]} · ${(x.items||[]).length} பொருள்${x.customer_phone?' · '+x.customer_phone:''}</small></div><div class="rt">›</div></button>`).join('')}</div>`:`<div class="card empty"><b>🧾</b>${S.repErr?'':'இந்த நாளில் பில் இல்லை'}</div>`;
  const C={};(S.credit||[]).forEach(x=>{const k=x.customer_phone||'?';(C[k]=C[k]||{ph:k,nm:'',t:0,n:0,last:x.sold_at});C[k].t+=+x.total||0;C[k].n++;if(!C[k].nm&&x.customer_name)C[k].nm=x.customer_name;});
  const CL=Object.values(C).sort((a,b)=>b.t-a.t);
  if(CL.length)h+=`<div class="sec">📒 கடன் புத்தகம் (90 நாள்)</div><div class="card" style="padding:4px 10px">${CL.map(c=>`<div class="row"><div class="tx"><b>${esc(c.nm||c.ph)}</b><small>${c.ph} · ${c.n} பில்</small></div><div class="rt st-o">${rs(c.t)}</div><a class="btn sm" style="background:#25d366;text-decoration:none" href="https://wa.me/91${c.ph}?text=${encodeURIComponent('வணக்கம் '+(c.nm||'')+' 🙏 '+S.shop.name+'-ல் உங்கள் கடன் நிலுவை '+rs(c.t)+'. வசதிப்படும்போது கொடுத்துவிடுங்கள். நன்றி')}" target="_blank" rel="noopener">💬</a></div>`).join('')}</div><div class="note">கடன் திரும்ப வந்ததும் அந்தப் பில்லைத் திறந்து "வசூலானது" என்று மாற்றும் வசதி அடுத்த பதிப்பில்.</div>`;
  h+=`<div class="ver">${VER} · <button style="border:0;background:none;color:var(--rd);font-weight:800;font-size:12px" onclick="doLogout()">வெளியேறு</button></div>`;
  return h;
}
window.openSale=function(id){const x=S.sales.find(s=>s.id===id);if(!x)return;SH={k:'sale',id};
  sheet('🧾 பில் #'+(x.bill_no||''),`<div class="rc"><h3>${esc(S.shop.name)}</h3><div class="m">${new Date(x.sold_at).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}${x.voided?' · ❌ ரத்து செய்யப்பட்டது':''}</div>
    ${(x.items||[]).map(l=>`<div class="l"><span>${esc(l.n)} <small style="color:var(--mu)">${esc(lineLabel(l))}</small></span><span class="num">${rs(l.t!=null?l.t:l.q*l.p)}</span></div>`).join('')}
    <hr><div class="l T"><span>மொத்தம்</span><span class="num">${rs(x.total)}</span></div><div class="l"><span>${PAY[x.pay_mode][0]} ${PAY[x.pay_mode][1]}</span><span>${esc(x.customer_name||'')} ${x.customer_phone||''}</span></div></div>`,
    x.voided?`<button class="btn gh" onclick="closeSheet()">மூடு</button>`:`<button class="btn rd" onclick="voidSale('${x.id}')">❌ பில் ரத்து</button><button class="btn gh" onclick="closeSheet()">மூடு</button>`);};
window.voidSale=async function(id){if(!confirm('இந்தப் பில்லை ரத்து செய்யவா? பொருட்கள் கையிருப்பில் திரும்பச் சேரும்.'))return;
  try{const d=await rpc('counter_void',{p_id:id});if(!d||!d.ok)throw new Error(d&&d.msg);closeSheet();toast('❌ பில் ரத்து செய்யப்பட்டது');loadReport();loadData();}
  catch(e){toast('⚠️ ரத்து செய்ய net தேவை');}};

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}
boot();
</script>
