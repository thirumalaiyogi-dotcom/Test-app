<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>சிட்டை கடை</title>
<meta name="theme-color" content="#0b5d4b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="சிட்டை கடை">
<link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22%E0%AE%9A%E0%AE%BF%E0%AE%9F%E0%AF%8D%E0%AE%9F%E0%AF%88%20%E0%AE%95%E0%AE%9F%E0%AF%88%22%2C%22short_name%22%3A%22%E0%AE%9A%E0%AE%BF%E0%AE%9F%E0%AF%8D%E0%AE%9F%E0%AF%88%20%E0%AE%95%E0%AE%9F%E0%AF%88%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22orientation%22%3A%22portrait%22%2C%22background_color%22%3A%22%230b5d4b%22%2C%22theme_color%22%3A%22%230b5d4b%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%3D%2527http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%2527%2520viewBox%3D%270%200%20100%20100%2527%253E%253Ctext%2520y%3D%2527.9em%2527%2520font-size%3D%252790%2527%253E%F0%9F%8F%AA%253C%2Ftext%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22any%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#eef2f0;--card:#fff;--soft:#f5f7f6;--bd:#dde4e1;--tx:#13201c;--mu:#6b7a75;--mu2:#45534e;
  --g:#0f8a6c;--g2:#0b5d4b;--gs:rgba(15,138,108,.10);
  --or:#d97706;--ors:rgba(217,119,6,.12);--bl:#2563eb;--bls:rgba(37,99,235,.10);
  --rd:#dc2626;--rds:rgba(220,38,38,.10);
}
html,body{background:var(--bg);}
body{font-family:'Noto Sans Tamil',sans-serif;color:var(--tx);max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:30px;}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;}
.hide{display:none!important;}

/* auth */
.auth{padding:56px 22px 30px;}
.auth-logo{width:76px;height:76px;border-radius:22px;background:var(--g2);color:#fff;font-size:38px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.auth h1{text-align:center;font-size:22px;font-weight:800;}
.auth p.sub{text-align:center;color:var(--mu);font-size:13px;margin:4px 0 22px;}
.seg{display:flex;background:var(--soft);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:16px;}
.seg button{flex:1;border:none;background:none;padding:10px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--mu2);}
.seg button.on{background:var(--card);color:var(--g2);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.lbl{display:block;font-size:11.5px;font-weight:700;color:var(--mu2);margin:0 0 6px;}
.inp{width:100%;border:1.5px solid var(--bd);border-radius:12px;padding:13px 14px;font-size:15px;background:var(--card);color:var(--tx);outline:none;margin-bottom:12px;}
.inp:focus{border-color:var(--g);}
.btn{width:100%;border:none;border-radius:13px;padding:14px;font-size:15px;font-weight:800;background:var(--g);color:#fff;}
.btn:disabled{opacity:.6;}
.btn.ghost{background:var(--card);color:var(--mu2);border:1.5px solid var(--bd);margin-top:10px;}
.msg{font-size:12.5px;font-weight:700;margin-top:12px;text-align:center;line-height:1.5;}
.msg.err{color:var(--rd);} .msg.ok{color:var(--g2);}
.wait{padding:70px 24px;text-align:center;}
.wait .ic{font-size:52px;margin-bottom:10px;}
.wait h2{font-size:18px;font-weight:800;margin-bottom:8px;}
.wait p{font-size:13px;color:var(--mu2);line-height:1.6;margin-bottom:20px;}

/* header */
.hdr{background:var(--g2);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:20;}
.hdr-top{display:flex;align-items:center;gap:10px;}
.hdr-nm{flex:1;min-width:0;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-ic{background:rgba(255,255,255,.14);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:17px;display:flex;align-items:center;justify-content:center;position:relative;}
.hdr-ic.on::after{content:'';position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#7CFFB2;}
.sw-row{display:flex;gap:8px;margin-top:10px;}
.sw{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:12px;padding:9px 11px;font-size:12.5px;font-weight:700;text-align:left;}
.tg{width:38px;height:22px;border-radius:11px;background:rgba(255,255,255,.3);position:relative;flex-shrink:0;transition:background .2s;}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;}
.sw.on .tg{background:#34d399;} .sw.on .tg::after{transform:translateX(16px);}
.conn{font-size:10.5px;opacity:.85;margin-top:8px;display:flex;align-items:center;gap:6px;}
.dot{width:7px;height:7px;border-radius:50%;background:#fbbf24;} .dot.live{background:#34d399;} .dot.off{background:#f87171;}

/* sound banner */
.snd{margin:12px 14px 0;background:#fff7ed;border:1.5px solid #fdba74;border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;}
.snd b{display:block;font-size:13.5px;} .snd small{font-size:11.5px;color:var(--mu2);}
.snd button{margin-left:auto;background:var(--or);color:#fff;border:none;border-radius:10px;padding:10px 13px;font-weight:800;font-size:12.5px;white-space:nowrap;}

/* tabs */
.tabs{display:flex;gap:6px;padding:12px 14px 4px;position:sticky;top:var(--hh,118px);z-index:15;background:var(--bg);}
.tab{flex:1;border:1.5px solid var(--bd);background:var(--card);border-radius:12px;padding:9px 4px;font-size:12px;font-weight:800;color:var(--mu2);position:relative;}
.tab.on{background:var(--g);border-color:var(--g);color:#fff;}
.tab .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--rd);color:#fff;font-size:10.5px;margin-left:3px;}
.tab.on .n{background:#fff;color:var(--g2);}

/* orders */
.list{padding:8px 14px;}
.empty{text-align:center;padding:50px 20px;color:var(--mu);}
.empty .ic{font-size:40px;margin-bottom:8px;}
.oc{background:var(--card);border:1.5px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.oc.new{border-color:var(--or);box-shadow:0 0 0 3px var(--ors);animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(217,119,6,.06);}}
.oc-top{display:flex;align-items:center;gap:8px;}
.oc-no{font-size:15px;font-weight:800;}
.oc-ago{font-size:11.5px;color:var(--mu);margin-left:auto;}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;margin-top:6px;}
.p-new{background:var(--ors);color:var(--or);} .p-go{background:var(--bls);color:var(--bl);}
.p-ok{background:var(--gs);color:var(--g2);} .p-bad{background:var(--rds);color:var(--rd);}
.cu{margin-top:10px;padding:10px 12px;background:var(--soft);border-radius:12px;font-size:13px;line-height:1.55;}
.cu b{font-size:14px;}
.cu-act{display:flex;gap:8px;margin-top:8px;}
.cu-act a{flex:1;text-align:center;text-decoration:none;font-size:12.5px;font-weight:800;border-radius:10px;padding:8px;border:1.5px solid var(--bd);color:var(--g2);background:var(--card);}
.its{margin-top:10px;border-top:1px dashed var(--bd);padding-top:8px;}
.it{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:3px 0;}
.it span:first-child{flex:1;}
.it .q{font-weight:800;color:var(--g2);margin-right:4px;}
.tot{display:flex;justify-content:space-between;font-size:16px;font-weight:800;border-top:1px solid var(--bd);margin-top:6px;padding-top:8px;}
.note{margin-top:8px;font-size:12.5px;background:#fffbeb;border-radius:10px;padding:8px 10px;color:#7c5a00;}
.acts{display:flex;gap:8px;margin-top:12px;}
.a{flex:1;border:none;border-radius:12px;padding:13px 8px;font-size:14px;font-weight:800;}
.a.pri{background:var(--g);color:#fff;} .a.blue{background:var(--bl);color:#fff;}
.a.no{flex:0 0 auto;background:var(--rds);color:var(--rd);padding:13px 15px;}
.a:disabled{opacity:.55;}
.info{margin-top:10px;font-size:12px;color:var(--mu2);text-align:center;}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.st{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 8px;text-align:center;}
.st b{display:block;font-size:19px;font-weight:800;}
.st small{font-size:10.5px;color:var(--mu);font-weight:700;}

/* products */
.ps{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px;}
.ps input{flex:1;border:none;outline:none;font-size:14px;background:none;color:var(--tx);}
.pr{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:8px;}
.pr.off{opacity:.55;}
.pr-im{width:46px;height:46px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex-shrink:0;}
.pr-im img{width:100%;height:100%;object-fit:cover;}
.pr-nm{font-size:13.5px;font-weight:800;}
.pr-br{font-size:11px;color:var(--mu);}
.pr-bt{display:flex;flex-direction:column;gap:5px;margin-left:auto;flex-shrink:0;}
.pb{border:none;border-radius:9px;padding:7px 10px;font-size:11.5px;font-weight:800;min-width:96px;}
.pb.av{background:var(--gs);color:var(--g2);} .pb.na{background:var(--rds);color:var(--rd);}
.pb.lw{background:var(--ors);color:var(--or);} .pb.okk{background:var(--soft);color:var(--mu2);}

/* dialog + toast */
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:22px;}
.dlg-b{background:var(--card);border-radius:18px;padding:20px;max-width:360px;width:100%;text-align:center;}
.dlg-b p{font-size:14.5px;font-weight:700;line-height:1.6;margin-bottom:16px;}
.dlg-b .acts{margin-top:0;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2a27;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:700;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center;}
.toast.show{opacity:1;}
.foot{display:flex;justify-content:center;gap:16px;padding:16px;}
.foot button{background:none;border:none;color:var(--mu);font-size:12.5px;font-weight:700;text-decoration:underline;}

/* parcel flow */
.pname{margin-top:10px;background:var(--gs);border:1.5px dashed var(--g);border-radius:12px;padding:10px 12px;}
.pname small{display:block;font-size:11px;font-weight:700;color:var(--g2);}
.pname b{font-size:18px;font-weight:800;}
.dlv{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--bl);background:var(--bls);border-radius:10px;padding:7px 10px;}
.dlv.none{color:var(--mu2);background:var(--soft);}
.it{cursor:pointer;border-radius:8px;padding:7px 6px;margin:0 -6px;}
.it .ck{flex:0 0 20px!important;display:inline-flex;width:20px;height:20px;border-radius:6px;border:2px solid var(--bd);margin-right:8px;align-items:center;justify-content:center;font-size:12px;vertical-align:-4px;flex-shrink:0;}
.it.done{background:var(--gs);}
.it.done .ck{background:var(--g);border-color:var(--g);color:#fff;}
.it.done .nm{text-decoration:line-through;color:var(--mu);}
.prog{font-size:11.5px;font-weight:700;color:var(--mu2);margin-top:6px;}
.newtag{margin-left:6px;background:var(--or);color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;}
</style>
</head>
<body>

<!-- LOGIN / SIGNUP -->
<div id="v-auth" class="auth hide">
  <div class="auth-logo">🏪</div>
  <h1>சிட்டை கடை</h1>
  <p class="sub">கடைக்காரர்களுக்கான app</p>
  <div class="seg"><button id="sg-in" class="on" onclick="authMode('in')">உள்நுழை</button><button id="sg-up" onclick="authMode('up')">புதிய கணக்கு</button></div>
  <div id="up-only" class="hide">
    <label class="lbl">உங்கள் பெயர்</label><input class="inp" id="a-nm" type="text" autocomplete="name" placeholder="பெயர்">
    <label class="lbl">மொபைல் எண்</label><input class="inp" id="a-ph" type="tel" inputmode="numeric" maxlength="10" placeholder="9XXXXXXXXX" oninput="this.value=this.value.replace(/\D/g,'').slice(0,10)">
  </div>
  <label class="lbl">Email</label><input class="inp" id="a-em" type="email" autocomplete="username" placeholder="you@example.com">
  <label class="lbl">Password</label><input class="inp" id="a-pw" type="password" autocomplete="current-password" placeholder="குறைந்தது 6 எழுத்து" onkeydown="if(event.key==='Enter')authGo()">
  <button class="btn" id="a-go" onclick="authGo()">உள்நுழை →</button>
  <div class="msg" id="a-msg"></div>
</div>

<!-- WAITING FOR APPROVAL -->
<div id="v-wait" class="wait hide">
  <div class="ic">⏳</div>
  <h2 id="w-ttl">அனுமதிக்காக காத்திருக்கிறது</h2>
  <p id="w-txt"></p>
  <button class="btn" onclick="boot()">🔄 மீண்டும் சரிபார்</button>
  <button class="btn ghost" onclick="logout()">வெளியேறு</button>
</div>

<!-- MAIN -->
<div id="v-main" class="hide">
  <div class="hdr" id="hdr">
    <div class="hdr-top">
      <div class="hdr-nm" id="h-nm">🏪</div>
      <button class="hdr-ic" id="h-wake" onclick="toggleWake()" title="திரை அணையாமல்">💡</button>
      <button class="hdr-ic" id="h-snd" onclick="toggleSound()" title="ஒலி">🔔</button>
      <button class="hdr-ic" onclick="refresh(true)" title="புதுப்பி">🔄</button>
    </div>
    <div class="sw-row">
      <button class="sw" id="sw-open" onclick="toggleShop('is_open')"><span id="sw-open-t">கடை</span><span class="tg"></span></button>
      <button class="sw" id="sw-acc" onclick="toggleShop('accepting_orders')"><span id="sw-acc-t">ஆர்டர்</span><span class="tg"></span></button>
    </div>
    <div class="conn"><span class="dot" id="c-dot"></span><span id="c-txt">இணைக்கிறது...</span></div>
  </div>
  <div class="snd" id="snd-bnr">
    <div><b>🔔 புது order ஒலியை இயக்குங்கள்</b><small>பார்சல் செய்ய புது order வந்ததும் phone ஒலிக்கும்</small></div>
    <button onclick="enableSound()">இயக்கு</button>
  </div>
  <div class="tabs">
    <button class="tab on" id="t-new" onclick="setTab('new')">📦 பார்சல்<span class="n hide" id="n-new"></span></button>
    <button class="tab" id="t-act" onclick="setTab('act')">🚴 காத்திருப்பு<span class="n hide" id="n-act"></span></button>
    <button class="tab" id="t-done" onclick="setTab('done')">✅ இன்று</button>
    <button class="tab" id="t-prod" onclick="setTab('prod')">🛒 பொருட்கள்</button>
  </div>
  <div class="list" id="list"></div>
  <div class="foot"><button onclick="logout()">வெளியேறு</button></div>
</div>

<div id="dlg" class="dlg hide"><div class="dlg-b"><p id="dlg-t"></p><div class="acts"><button class="a no" style="flex:1" onclick="dlgClose(false)">இல்லை</button><button class="a pri" style="flex:1" id="dlg-y" onclick="dlgClose(true)">ஆம்</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
// ── சிட்டை கடை (shop owner app) ──
// Flow: customer orders → admin OKs → THIS app shows it (items + customer name only) → shop packs → "📦 பார்சல் ரெடி" → delivery boy picks up.
// The shop never sees customer phone / address: orders come through the shop_orders() database function (flow.sql).
const SB_URL='https://cerstnckjygvcfekfxcp.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlcnN0bmNranlndmNmZWtmeGNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzOTY2NDEsImV4cCI6MjA5Mzk3MjY0MX0.Yl-5QyyEyiwmXG9u1kL08CxIanU-22Fx-HicEe2VYi8';
let sb=null;
try{sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'sitta_shop_auth'}});}catch(e){}

const $=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs=n=>{const v=Math.round((+n||0)*100)/100;return v.toFixed(2).replace(/\.?0+$/,'');};
let _tt=null;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),2600);}
function show(v){['v-auth','v-wait','v-main'].forEach(x=>$(x).classList.toggle('hide',x!==v));}
function lsGet(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch{return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

let me=null,shop=null,orders=[],prods=[],tab='new',prodQ='',busy={},pollT=null;
let seen=new Set(lsGet('sitta_shop_seen',[]));      // order ids the shop has already noticed (stops the ringing)
let ticks=lsGet('sitta_shop_ticks',{});            // {orderId:[itemIndex,...]} items already put in the bag

// ── AUTH ──
let aMode='in';
function authMode(m){
  aMode=m;$('sg-in').classList.toggle('on',m==='in');$('sg-up').classList.toggle('on',m==='up');
  $('up-only').classList.toggle('hide',m!=='up');$('a-go').textContent=m==='up'?'கணக்கு உருவாக்கு →':'உள்நுழை →';
  $('a-pw').autocomplete=m==='up'?'new-password':'current-password';$('a-msg').textContent='';
}
async function authGo(){
  const em=$('a-em').value.trim(),pw=$('a-pw').value,msg=$('a-msg'),b=$('a-go');
  msg.className='msg err';
  if(!/^\S+@\S+\.\S+$/.test(em)){msg.textContent='சரியான email உள்ளிடுங்கள்';return;}
  if(pw.length<6){msg.textContent='Password குறைந்தது 6 எழுத்து';return;}
  let nm='',ph='';
  if(aMode==='up'){
    nm=$('a-nm').value.trim();ph=$('a-ph').value.trim();
    if(!nm){msg.textContent='பெயரை உள்ளிடுங்கள்';return;}
    if(!/^[6-9]\d{9}$/.test(ph)){msg.textContent='சரியான 10 இலக்க மொபைல் எண்';return;}
  }
  b.disabled=true;msg.className='msg';msg.textContent='⏳ சரிபார்க்கிறது...';
  try{
    if(aMode==='up'){
      const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:nm,phone:ph}}});

      :/not confirmed/i.test(t)?'Email உறுதி செய்யப்படவில்லை — inbox-ல் உள்ள link-ஐ தட்டுங்கள்'
      :/rate limit/i.test(t)?'⚠️ இப்போது அதிக கோரிக்கைகள் — சிறிது நேரம் கழித்து முயற்சிக்கவும் (அல்லது சிட்டை admin-இடம் கணக்கு உருவாக்கச் சொல்லுங்கள்)'
      :/signups.*disabled/i.test(t)?'⚠️ புதிய கணக்கு உருவாக்குவது தற்போது நிறுத்தப்பட்டுள்ளது — சிட்டை admin-ஐ தொடர்பு கொள்ளுங்கள்'
      :'❌ '+(t||'Network பிரச்சனை');

}
async function logout(){

// ── BOOT ──
async function boot(){
  if(!sb){show('v-auth');$('a-msg').className='msg err';$('a-msg').textContent='⚠️ Internet இணைப்பு இல்லை — page-ஐ refresh செய்யுங்கள்';return;}
  const {data:{session}}=await sb.auth.getSession();
  if(!session){show('v-auth');return;}
  const {data:p,error}=await sb.from('profiles').select('id,full_name,role,shop_id,approved').eq('id',session.user.id).maybeSingle();
  if(error){show('v-wait');$('w-ttl').textContent='இணைக்க முடியவில்லை';$('w-txt').textContent='Network சரிபார்த்து மீண்டும் முயற்சிக்கவும்.';return;}
  me=p;
  if(!p||!p.approved||p.role!=='merchant'||!p.shop_id){
    show('v-wait');
    if(p&&p.approved&&p.role==='admin'){$('w-ttl').textContent='இது admin கணக்கு';$('w-txt').textContent='கடைக்காரர் கணக்கில் உள்நுழையுங்கள். Admin வேலைகள் admin app-ல்.';}
    else if(p&&p.approved&&p.role==='delivery'){$('w-ttl').textContent='இது delivery கணக்கு';$('w-txt').textContent='Delivery app-ல் (delivery.html) உள்நுழையுங்கள்.';}
    else{$('w-ttl').textContent='அனுமதிக்காக காத்திருக்கிறது';$('w-txt').textContent='சிட்டை admin உங்கள் கணக்கை ('+(session.user.email||'')+') அனுமதித்து, உங்கள் கடையை ஒதுக்கியதும் இங்கே order-கள் தெரியும்.';}
    return;
  }
  const {data:s}=await sb.from('shops').select('id,name,logo,is_open,accepting_orders').eq('id',p.shop_id).maybeSingle();
  shop=s||{id:p.shop_id,name:p.shop_id};
  show('v-main');renderHdr();
  $('snd-bnr').classList.toggle('hide',soundOn&&audioOk());
  setTab(tab);
  await refresh();
  startLive();
}

async function toggleShop(k){

  }catch(e){toast('⚠️ மாற்ற முடியவில்லை — மீண்டும் முயற்சிக்கவும்');}

// ── DATA (every 15 s; the shop has no direct access to the orders table) ──
let _refBusy=false;
async function refresh(manual){
  if(!shop||_refBusy)return;_refBusy=true;
  try{
    const {data,error}=await sb.rpc('shop_orders',{p_days:3});
    if(error){setConn('off','இணைப்பு இல்லை — மீண்டும் முயற்சிக்கிறது');if(manual)toast('⚠️ ஏற்ற முடியவில்லை');return;}
    orders=Array.isArray(data)?data:[];
    setConn('live','புதுப்பிக்கப்பட்டது '+new Date().toLocaleTimeString('ta-IN',{hour:'2-digit',minute:'2-digit'})+' · 15 விநாடிக்கு ஒருமுறை');
    // forget ticks / seen for orders no longer listed
    const ids=new Set(orders.map(o=>o.id));
    Object.keys(ticks).forEach(k=>{if(!ids.has(k))delete ticks[k];});lsSet('sitta_shop_ticks',ticks);
    seen=new Set([...seen].filter(x=>ids.has(x)));lsSet('sitta_shop_seen',[...seen]);
    render();checkRing();
    if(manual)toast('🔄 புதுப்பிக்கப்பட்டது');

}
async function loadProds(){
  const {data,error}=await sb.from('products').select('id,name,brand,emoji,photo,hidden,stock').eq('shop_id',shop.id).order('name');
  if(error){toast('⚠️ பொருட்களை ஏற்ற முடியவில்லை');return;}
  prods=data||[];if(tab==='prod')render();
}
function setConn(cls,t){const d=$('c-dot');if(!d)return;d.className='dot'+(cls?' '+cls:'');$('c-txt').textContent=t;}
function startLive(){stopLive();pollT=setInterval(()=>refresh(),15000);}
function stopLive(){clearInterval(pollT);pollT=null;}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&shop){refresh();if(wakeWanted)reqWake();}});
window.addEventListener('online',()=>{if(shop)refresh();});
window.addEventListener('offline',()=>setConn('off','📴 இணைய இணைப்பு இல்லை'));

// ── SOUND: rings while a new parcel order hasn't been looked at; any tap on the screen = "seen" ──
let soundOn=localStorage.getItem('sitta_shop_snd')!=='0',ac=null,ringT=null,titleT=null,titleOn=false;
function audioOk(){return !!(ac&&ac.state==='running');}
function enableSound(){
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();}catch{}
  soundOn=true;localStorage.setItem('sitta_shop_snd','1');
  chime();$('snd-bnr').classList.add('hide');renderHdr();checkRing();
}
function toggleSound(){
  if(!soundOn||!audioOk()){enableSound();toast('🔔 ஒலி இயக்கப்பட்டது');return;}
  soundOn=false;localStorage.setItem('sitta_shop_snd','0');stopRing();renderHdr();toast('🔕 ஒலி நிறுத்தப்பட்டது');
}
function chime(){
  if(!ac)return;
  try{
    [[880,0],[1175,.18],[1568,.36]].forEach(([f,t])=>{
      const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
      o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.6,ac.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t+.32);
      o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.34);
    });
  }catch{}
}
const TOPACK=['SHOP_ACCEPTED','PREPARING'];
function unseen(){return orders.filter(o=>TOPACK.includes(o.order_status)&&!seen.has(o.id));}
function checkRing(){
  const n=unseen().length;
  if(n>0){
    if(!ringT){
      const ring=()=>{if(soundOn)chime();try{navigator.vibrate&&navigator.vibrate([300,150,300]);}catch{}};
      ring();ringT=setInterval(ring,4000);
      titleT=setInterval(()=>{titleOn=!titleOn;document.title=titleOn?'🔔 ('+unseen().length+') புது order!':'சிட்டை கடை';},1000);
    }
  }else stopRing();
}
function stopRing(){clearInterval(ringT);ringT=null;clearInterval(titleT);titleT=null;document.title='சிட்டை கடை';try{navigator.vibrate&&navigator.vibrate(0);}catch{}}
function markSeen(){
  const u=unseen();if(!u.length)return;
  u.forEach(o=>seen.add(o.id));lsSet('sitta_shop_seen',[...seen]);stopRing();
}
document.addEventListener('pointerdown',()=>{if(shop&&ringT)setTimeout(()=>{markSeen();render();},150);},true);

// ── KEEP SCREEN ON ──
let wakeLock=null,wakeWanted=false;
async function reqWake(){try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;renderHdr();});}catch{wakeLock=null;}renderHdr();}
async function toggleWake(){
  if(!('wakeLock' in navigator)){toast('இந்த phone-ல் இந்த வசதி இல்லை');return;}
  if(wakeLock){wakeWanted=false;try{await wakeLock.release();}catch{}wakeLock=null;renderHdr();toast('💡 திரை தானாக அணையும்');return;}
  wakeWanted=true;await reqWake();toast(wakeLock?'💡 திரை அணையாமல் இருக்கும்':'இயக்க முடியவில்லை');
}

// ── RENDER ──
function isToday(d){return d&&new Date(d).toDateString()===new Date().toDateString();}
function ago(d){const m=Math.max(0,Math.round((Date.now()-new Date(d))/60000));if(m<1)return 'இப்போது';if(m<60)return m+' நிமிடம் முன்';const h=Math.floor(m/60);if(h<24)return h+' மணி '+(m%60)+' நி. முன்';return new Date(d).toLocaleDateString('ta-IN',{day:'numeric',month:'short'});}
function setTab(t){
  tab=t;['new','act','done','prod'].forEach(k=>$('t-'+k).classList.toggle('on',k===t));
  if(t==='prod'&&!prods.length&&shop)loadProds();
  render();window.scrollTo({top:0});
}
function render(){
  if(!shop)return;
  const by=(a,b)=>new Date(a.approved_at||a.created_at)-new Date(b.approved_at||b.created_at);
  const pack=orders.filter(o=>TOPACK.includes(o.order_status)).sort(by);
  const wait=orders.filter(o=>o.order_status==='READY_FOR_PICKUP').sort(by);
  const done=orders.filter(o=>['OUT_FOR_DELIVERY','DELIVERED','CANCELLED'].includes(o.order_status)&&isToday(o.approved_at||o.created_at));
  [['n-new',pack.length],['n-act',wait.length]].forEach(([id,n])=>{$(id).textContent=n;$(id).classList.toggle('hide',!n);});
  const L=$('list');
  if(tab==='prod'){L.innerHTML=prodHTML();return;}
  if(tab==='done'){
    const today=orders.filter(o=>isToday(o.approved_at||o.created_at));
    const ok=today.filter(o=>o.order_status!=='CANCELLED');
    const sales=ok.reduce((s,o)=>s+(+o.subtotal||0),0);
    L.innerHTML=`<div class="stats"><div class="st"><b>${ok.length}</b><small>இன்றைய ஆர்டர்</small></div><div class="st"><b>₹${rs(sales)}</b><small>பொருட்கள் மதிப்பு</small></div><div class="st"><b>${today.length-ok.length}</b><small>ரத்து</small></div></div>`
      +(done.length?done.map(cardHTML).join(''):`<div class="empty"><div class="ic">📋</div>இன்று delivery-க்கு போன ஆர்டர் இல்லை</div>`);
    return;
  }
  const arr=tab==='new'?pack:wait;
  L.innerHTML=arr.length?arr.map(cardHTML).join(''):(tab==='new'
    ?`<div class="empty"><div class="ic">🛎️</div>பார்சல் செய்ய ஆர்டர் இல்லை<br><small>Admin OK செய்ததும் இங்கே வரும்${soundOn&&audioOk()?', ஒலியும் வரும்':''}</small></div>`
    :`<div class="empty"><div class="ic">🚴</div>Delivery-க்காக காத்திருக்கும் பார்சல் இல்லை</div>`);
}
const ST={SHOP_ACCEPTED:['📦 பார்சல் செய்ய வேண்டும்','p-new'],PREPARING:['📦 பார்சல் செய்ய வேண்டும்','p-new'],READY_FOR_PICKUP:['✅ ரெடி — delivery வர வேண்டும்','p-go'],DELIVERY_ASSIGNED:['🚴 Delivery ஒதுக்கப்பட்டது','p-go'],OUT_FOR_DELIVERY:['🛵 Delivery எடுத்துச் சென்றார்','p-ok'],DELIVERED:['🎉 டெலிவரி முடிந்தது','p-ok'],CANCELLED:['❌ ரத்து','p-bad']};
function cardHTML(o){
  const st=ST[o.order_status]||[esc(o.order_status),'p-go'];
  const canPack=TOPACK.includes(o.order_status);
  const tk=new Set(ticks[o.id]||[]);
  const items=o.order_items||[];
  const its=items.map((i,ix)=>{
    const d=tk.has(ix);
    return `<div class="it${d?' done':''}"${canPack?` onclick="tick('${o.id}',${ix})"`:''}><span style="display:flex;align-items:flex-start">${canPack?`<span class="ck">${d?'✓':''}</span>`:''}<span class="nm"><span class="q">${esc(i.quantity)}×</span>${esc(i.product_name)}${i.pack_size?' · '+esc(i.pack_size):''}</span></span><span>₹${rs(i.total_price)}</span></div>`;
  }).join('');
  const isNew=canPack&&!seen.has(o.id);
  const b=busy[o.id]?' disabled':'';
  return `<div class="oc${isNew?' new':''}">
    <div class="oc-top"><span class="oc-no">${esc(o.order_number||'')}</span>${isNew?'<span class="newtag">புதுசு</span>':''}<span class="oc-ago">${ago(o.approved_at||o.created_at)}</span></div>
    <span class="pill ${st[1]}">${st[0]}</span>
    <div class="pname"><small>📝 பார்சலில் எழுத வேண்டிய பெயர்</small><b>${esc(o.customer_name||'')}</b> <span style="font-size:13px;font-weight:700;color:var(--mu2)">· ${esc(o.order_number||'')}</span></div>
    <div class="dlv${o.delivery_name?'':' none'}">${o.delivery_name?'🚴 எடுக்க வருபவர்: '+esc(o.delivery_name):'🚴 Delivery நபர் இன்னும் ஒதுக்கப்படவில்லை'}</div>
    <div class="its">${its}${canPack&&items.length?`<div class="prog">${tk.size}/${items.length} பொருட்கள் பையில் வைக்கப்பட்டன ${tk.size===items.length?'✅':''}</div>`:''}
      <div class="tot"><span>பொருட்கள் மதிப்பு</span><span>₹${rs(o.subtotal)}</span></div></div>
    ${o.customer_note?`<div class="note">🗒️ ${esc(o.customer_note)}</div>`:''}
    ${canPack?`<div class="acts"><button class="a pri"${b} onclick="markReady('${o.id}')">📦 பார்சல் ரெடி</button></div>`:''}
    ${o.order_status==='READY_FOR_PICKUP'?`<div class="info">Delivery நபர் வந்ததும் பார்சலைக் கொடுங்கள்</div>`:''}
  </div>`;
}
function tick(id,ix){
  const a=new Set(ticks[id]||[]);a.has(ix)?a.delete(ix):a.add(ix);
  ticks[id]=[...a];lsSet('sitta_shop_ticks',ticks);render();

// ── "📦 பார்சல் ரெடி" ──
let _dlgCb=null;
function confirmDlg(t,cb){$('dlg-t').textContent=t;_dlgCb=cb;$('dlg').classList.remove('hide');}
function dlgClose(y){$('dlg').classList.add('hide');const cb=_dlgCb;_dlgCb=null;if(y&&cb)cb();}
function markReady(id){
  const o=orders.find(x=>x.id===id);if(!o)return;
  const n=(o.order_items||[]).length,t=(ticks[id]||[]).length;
  const go=()=>doReady(id);
  if(n&&t<n)confirmDlg(`${n-t} பொருட்கள் இன்னும் டிக் செய்யப்படவில்லை. பார்சல் முழுமையாக ரெடியா?`,go);
  else confirmDlg(`${o.customer_name||''} — ${o.order_number||''} பார்சல் ரெடியா?`,go);
}
async function doReady(id){

  try{
    const {data,error}=await sb.rpc('shop_mark_ready',{p_id:id});
    if(error)throw error;
    if(data&&data.ok){const o=orders.find(x=>x.id===id);if(o)o.order_status='READY_FOR_PICKUP';toast('✅ பார்சல் ரெடி — delivery நபருக்கு தெரிவிக்கப்பட்டது');}
    else toast('ℹ️ '+((data&&data.msg)||'மாற்ற முடியவில்லை'));
  }catch(e){toast('⚠️ Network பிரச்சனை — மீண்டும் முயற்சிக்கவும்');}
  finally{delete busy[id];await refresh();}
}

// ── PRODUCTS: availability + low stock ──

      <div class="pr-bt">
        <button class="pb ${p.hidden?'na':'av'}"${b} onclick="setProd(${p.id},{hidden:${!p.hidden}})">${p.hidden?'🚫 இல்லை':'✅ கிடைக்கும்'}</button>
        <button class="pb ${p.stock==='low'?'lw':'okk'}"${b} onclick="setProd(${p.id},{stock:'${p.stock==='low'?'ok':'low'}'})">${p.stock==='low'?'⚠️ குறைவு':'Stock OK'}</button>
      </div></div>`;}).join(''):`<div class="empty"><div class="ic">📦</div>${prods.length?'பொருள் கிடைக்கவில்லை':'பொருட்கள் இல்லை'}</div>`);
}
async function setProd(id,patch){
  if(busy['p'+id])return;busy['p'+id]=1;render();
  try{
    const {data,error}=await sb.from('products').update(patch).eq('id',id).select('id,hidden,stock');
    if(error||!data||!data.length)throw error||new Error('0');
    const p=prods.find(x=>x.id===id);if(p)Object.assign(p,data[0]);
    toast('hidden' in patch?(patch.hidden?'🚫 Customer-களுக்கு மறைக்கப்பட்டது':'✅ மீண்டும் கிடைக்கிறது'):(patch.stock==='low'?'⚠️ குறைவு என குறிக்கப்பட்டது':'✅ Stock OK'));
  }catch(e){toast('⚠️ மாற்ற முடியவில்லை');}
  finally{delete busy['p'+id];render();}
}

// ── START ──
authMode('in');
if(sb){sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'&&shop){stopLive();stopRing();shop=null;show('v-auth');}});}
setInterval(()=>{if(shop&&tab!=='prod')render();},60000);
boot();
</script>
